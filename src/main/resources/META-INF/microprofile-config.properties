# ============================================
# SERVICE-SERVICE CONFIGURATION
# ============================================

# Application Info
app.name=service-service
app.version=1.0.0
app.description=Service Management Microservice

# Server Configuration
server.port=8087

# Database Configuration
datasource.url=jdbc:postgresql://localhost:3606/boloindia_dev?currentSchema=service_service
datasource.username=boloindia
datasource.password=boloindiapass
datasource.driver=org.postgresql.Driver

# Kafka Configuration
kafka.bootstrap.servers=localhost:9092
kafka.consumer.group.id=service-service-group
kafka.consumer.auto.offset.reset=earliest
kafka.consumer.enable.auto.commit=true
kafka.consumer.poll.interval.ms=1000

# Kafka Topics - Producer
kafka.topic.service.created=service.created
kafka.topic.service.updated=service.updated
kafka.topic.service.deleted=service.deleted
kafka.topic.service.activated=service.activated
kafka.topic.service.deactivated=service.deactivated

# Kafka Topics - Consumer
kafka.topic.org.approved=org.approved

# Service Code Generation
service.code.prefix=SRV_
service.code.length=12

# Slug Configuration
service.slug.max.length=250

# Hierarchy Configuration
service.hierarchy.max.depth=10
service.hierarchy.cache.enabled=true

# Upload Configuration (MinIO - Future)
upload.minio.endpoint=http://localhost:9000
upload.minio.access.key=minioadmin
upload.minio.secret.key=minioadmin
upload.minio.bucket.services=service-icons
upload.max.file.size=5242880
upload.allowed.extensions=jpg,jpeg,png,gif,svg

# ============================================
# JWT Configuration (CRITICAL!)
# ============================================
mp.jwt.verify.publickey.location=/keys/publicKey.pem
mp.jwt.verify.issuer=auth-service
mp.jwt.verify.audiences=boloindia-services

# IMPORTANT: Tell Payara to look for JWT in Authorization header
mp.jwt.token.header=Authorization
mp.jwt.token.cookie=Bearer

# Enable detailed JWT logging
mp.jwt.verify.publickey.algorithm=RS256

# Additional security settings
smallrye.jwt.verify.aud=boloindia-services
smallrye.jwt.verify.issuer=auth-service


# Logging
logging.level=INFO
logging.kafka.level=FINE

# CORS Configuration
#cors.allowed.origins=http://localhost:3000,http://localhost:4200
#cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
#cors.allowed.headers=Content-Type,Authorization,X-User-Id,X-Org-Id,X-Role

# Rate Limiting (Future)
rate.limit.enabled=false
rate.limit.requests.per.minute=100

# Cache Configuration (Future)
#cache.enabled=true
#cache.ttl.seconds=300

# Pagination Defaults
#pagination.default.page.size=20
#pagination.max.page.size=100

# Feature Flags
feature.auto.create.default.services=false
feature.service.image.upload=true
feature.geolocation.search=true
feature.operating.hours=true
